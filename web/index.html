<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务管线可观测面板</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0f1419; --panel:#171d25; --line:#2a3340; --txt:#d7dde5; --dim:#8794a6;
    --pending:#5b6675; --running:#3b82f6; --retry:#f59e0b; --wait:#a855f7; --ok:#22c55e; --fail:#ef4444;
    --blocked:#475569; --cancel:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); }
  header { display:flex; align-items:center; gap:16px; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; }
  .chip { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:2px 10px; color:var(--dim); font-size:12px; }
  .chip b { color:var(--txt); }
  .chip.dead { border-color:var(--fail); color:var(--fail); }
  main { display:grid; grid-template-columns:300px 1fr; gap:12px; padding:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .panel h2 { font-size:13px; margin:0 0 8px; color:var(--dim); font-weight:600; }
  .task { padding:8px; border:1px solid var(--line); border-radius:6px; margin-bottom:6px; cursor:pointer; }
  .task:hover, .task.sel { border-color:var(--running); }
  .task .row { display:flex; justify-content:space-between; gap:6px; }
  .badge { font-size:11px; padding:1px 7px; border-radius:10px; color:#fff; white-space:nowrap; }
  .st-PENDING{background:var(--pending)} .st-RUNNING{background:var(--running)} .st-RETRY_WAIT{background:var(--retry)}
  .st-AWAITING_APPROVAL{background:var(--wait)} .st-SUCCEEDED{background:var(--ok)} .st-FAILED{background:var(--fail)}
  .st-BLOCKED{background:var(--blocked)} .st-CANCELLED{background:var(--cancel)}
  .bar { height:5px; background:#222b36; border-radius:3px; overflow:hidden; margin-top:6px; }
  .bar > i { display:block; height:100%; background:var(--running); transition:width .4s; }
  .bar.ok > i { background:var(--ok); } .bar.bad > i { background:var(--fail); }
  button { background:#222b36; color:var(--txt); border:1px solid var(--line); border-radius:5px; padding:4px 10px; cursor:pointer; font-size:12px; }
  button:hover { border-color:var(--running); } button.danger:hover { border-color:var(--fail); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  label { display:block; margin:4px 0; color:var(--dim); font-size:12px; }
  input[type=text], input[type=number], select { background:#0f1419; color:var(--txt); border:1px solid var(--line); border-radius:4px; padding:3px 6px; width:100%; }
  #dagwrap { position:relative; overflow:auto; padding:6px 0 12px; }
  #dag { position:relative; }
  svg#edges { position:absolute; left:0; top:0; pointer-events:none; }
  .node { position:absolute; width:158px; height:58px; border-radius:7px; padding:5px 8px; border:2px solid var(--line); background:#1b222c; cursor:pointer; overflow:hidden; }
  .node .k { font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node .m { color:var(--dim); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .node.sel { box-shadow:0 0 0 2px #fff3; }
  .n-PENDING{border-color:var(--pending)} .n-RUNNING{border-color:var(--running);animation:pulse 1.2s infinite}
  .n-RETRY_WAIT{border-color:var(--retry)} .n-AWAITING_APPROVAL{border-color:var(--wait)} .n-SUCCEEDED{border-color:var(--ok)}
  .n-FAILED{border-color:var(--fail)} .n-BLOCKED{border-color:var(--blocked);opacity:.6} .n-CANCELLED{border-color:var(--cancel);opacity:.6}
  @keyframes pulse { 50% { box-shadow:0 0 8px var(--running); } }
  .tag { font-size:10px; padding:0 5px; border-radius:3px; background:#2a3340; color:var(--txt); margin-left:3px; }
  .tag.cache { background:#0e7490; } .tag.gpu { background:#7c3aed; } .tag.retry { background:var(--retry); color:#111; }
  table { border-collapse:collapse; width:100%; font-size:12px; } td,th { border-bottom:1px solid var(--line); padding:3px 6px; text-align:left; vertical-align:top; }
  th { color:var(--dim); font-weight:600; }
  #events { max-height:260px; overflow:auto; font:12px/1.5 ui-monospace,Consolas,monospace; }
  #events div { border-bottom:1px dashed #222b36; padding:1px 0; white-space:pre-wrap; word-break:break-all; }
  .k-COMMIT_REJECTED,.k-FAIL_REJECTED,.k-CACHE_INVALID { color:var(--retry); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .muted { color:var(--dim); } .err { color:var(--fail); }
  #framegrid { display:flex; flex-wrap:wrap; gap:3px; }
  .fc { width:15px; height:15px; border-radius:3px; background:var(--pending); cursor:pointer; border:1px solid transparent; }
  .fc.DONE { background:var(--ok); } .fc.cached { background:#0e7490; } .fc.DEGRADED { background:#a16207; }
  .fc.FAILED { background:var(--fail); } .fc.INFLIGHT { background:var(--running); animation:pulse 1s infinite; }
  .fc.RETRY { background:var(--retry); } .fc.PENDING { background:var(--pending); }
  .fc.dup { border-color:#fff; } .fc.sel { outline:2px solid #fff; }
  .legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--dim); margin-bottom:6px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:3px; vertical-align:-1px; }
  code { background:#0f1419; padding:0 4px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <h1>任务管线可观测面板</h1>
  <span id="chips"></span><span id="workers"></span>
</header>
<main>
  <aside>
    <div class="panel" style="margin-bottom:12px">
      <h2>逐帧风格化(主流水线:6 道工序 + 质检)</h2>
      <label>素材(samples/ 目录)<select id="m_src"></select></label>
      <label>指令 prompt<input type="text" id="m_prompt" value="日系动漫风格,保持人物与动作不变,线条清晰"></label>
      <label>provider
        <select id="m_provider" onchange="$('m_model').disabled = this.value==='mock'">
          <option value="mock">mock(离线替身,不花钱)</option>
          <option value="ark">ark(豆包,花钱;需要环境变量 ARK_API_KEY)</option>
        </select></label>
      <label>模型 ID(provider=ark 时必填)<input type="text" id="m_model" disabled placeholder="方舟控制台里的模型 ID"></label>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px">
        <label>分块数<input type="number" id="m_chunks" value="4" min="1" max="16"></label>
        <label>抽帧间隔<input type="number" id="m_stride" value="6" min="1"></label>
        <label>预算(元)<input type="number" id="m_budget" value="20" min="0.1" step="0.1"></label>
      </div>
      <label>故障注入(仅 mock)
        <select id="m_inject">
          <option value="">无</option>
          <option value="transient">stylize_0 首帧瞬时失败 2 次(帧内重试)</option>
          <option value="rate_limit">stylize_0 首帧 429 用完重试(只重做这一帧)</option>
          <option value="crash">stylize_0 进程崩溃(复用已完成的帧)</option>
          <option value="response_lost">stylize_0 首帧响应丢失(可能多付一次)</option>
          <option value="moderation">stylize_0 首帧被审核拒绝(降级)</option>
        </select></label>
      <label><input type="checkbox" id="m_approval"> 发布前需要人工审批</label>
      <div style="display:flex;gap:6px;margin-top:6px"><button onclick="submitStyle()">提交</button>
        <button onclick="loadMedia()">刷新素材列表</button></div>
      <div id="m_msg" class="muted" style="margin-top:4px"></div>
    </div>
    <details class="panel" style="margin-bottom:12px">
      <summary style="cursor:pointer;color:var(--dim)">引擎演示:MOCK DAG(sleep + 确定性字节,用于展示故障矩阵)</summary>
      <label>素材 source(相同 source 会命中缓存)<input type="text" id="f_source" value="demo.mp4"></label>
      <label>分块数 chunks<input type="number" id="f_chunks" value="4" min="1" max="16"></label>
      <label>故障注入
        <select id="f_chaos">
          <option value="">无</option>
          <option value="transient">segment_0 瞬时失败 2 次(重试)</option>
          <option value="crash">segment_1 进程崩溃(exit 137)</option>
          <option value="hang">swap_0 卡死(无进展,5s 后强杀)</option>
          <option value="qc">质检永久失败(下游 BLOCKED)</option>
          <option value="source">坏素材(probe 永久失败)</option>
        </select></label>
      <label><input type="checkbox" id="f_approval"> 发布前需要人工审批</label>
      <div style="display:flex;gap:6px;margin-top:6px"><button onclick="submitTask()">提交</button>
        <button onclick="document.getElementById('f_source').value='clip-'+Math.floor(Math.random()*9999)+'.mp4'">随机素材</button></div>
      <div id="submitmsg" class="muted" style="margin-top:4px"></div>
    </details>
    <div class="panel" style="margin-bottom:12px">
      <h2>自然语言提交(Planner Agent,目前只覆盖 MOCK DAG)</h2>
      <textarea id="nl" rows="3" style="width:100%;background:#0f1419;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px">把 demo.mp4 的主角换成红发女孩,分成 3 段,发布到测试库</textarea>
      <div class="muted" style="font-size:11px">试试:"……发布并且不用审批"(触发策略护栏→自动修复)</div>
      <div style="margin-top:6px"><button onclick="submitPlan()">规划并提交</button></div>
      <div id="planmsg" class="muted" style="margin-top:4px"></div>
    </div>
    <div class="panel"><h2>任务列表</h2><div id="tasks"></div></div>
  </aside>
  <section>
    <div class="panel" id="detail"><span class="muted">← 选择一个任务</span></div>
    <div class="grid2" id="framesrow" style="margin-top:12px;display:none">
      <div class="panel"><h2>帧网格(工序 3:每格一个关键帧,点击查看源图与结果)</h2><div id="framegrid"></div><div id="frameview" style="margin-top:8px"></div></div>
      <div class="panel"><h2>用量与费用(接口返回的用量 + 按标价估算)</h2><div id="usage" class="muted">-</div></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="panel"><h2>步骤详情(点击 DAG 节点)</h2><div id="stepinfo" class="muted">未选择步骤</div></div>
      <div class="panel"><h2>事件时间线(追加式历史)</h2><div id="events"></div></div>
    </div>
    <div class="grid2" style="margin-top:12px">
      <div class="panel"><h2>AI 诊断(人在回路)</h2><div id="diag" class="muted">选择任务后显示</div></div>
      <div class="panel"><h2>LLM 调用追踪</h2><div id="llm" class="muted">选择任务后显示</div></div>
    </div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtT = ts => ts ? new Date(ts*1000).toLocaleTimeString('zh-CN',{hour12:false}) : '-';
const fmtD = s => s==null ? '-' : (s<1 ? (s*1000|0)+'ms' : s.toFixed(1)+'s');
let selTask = null, selStep = null, evs = [], evAfter = 0, curTask = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}

async function submitTask() {
  const chaosKey = $('f_chaos').value;
  const body = { source: $('f_source').value, chunks: +$('f_chunks').value, frames: Math.max(+$('f_chunks').value*4, 8),
                 require_approval: $('f_approval').checked, unit_s: 0.5, base_delay: 1 };
  if (chaosKey === 'transient') body.chaos = {segment_0:{fail:{kind:'TRANSIENT',until_attempt:2,at:0.3}}};
  if (chaosKey === 'crash') body.chaos = {segment_1:{crash:{at:0.5,on_attempts:[1]}}};
  if (chaosKey === 'hang') { body.chaos = {swap_0:{hang:{at:0.5,on_attempts:[1]}}}; body.stall_timeout_s = 5; }
  if (chaosKey === 'qc') body.qc_fail = true;
  if (chaosKey === 'source') body.source = 'bad:corrupt.mp4';
  try {
    const r = await api('/api/tasks/animation', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
    $('submitmsg').textContent = '已提交 ' + r.id; selTask = r.id; selStep = null; evs = []; evAfter = 0;
    refresh();
  } catch (e) { $('submitmsg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
}

async function loadMedia() {
  try {
    const list = await api('/api/media');
    $('m_src').innerHTML = list.length
      ? list.map(m => `<option value="${esc(m.name)}">${esc(m.name)} (${m.size_mb} MB)</option>`).join('')
      : '<option value="">(samples/ 目录下没有视频)</option>';
  } catch (e) { $('m_msg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
}
async function submitStyle() {
  const body = { source: $('m_src').value, prompt: $('m_prompt').value.trim(), provider: $('m_provider').value,
                 model: $('m_model').value.trim() || null, chunks: +$('m_chunks').value, stride: +$('m_stride').value,
                 budget_cny: +$('m_budget').value, require_approval: $('m_approval').checked,
                 inject: $('m_inject').value || null, base_delay: 1, target_height: 360, concurrency: 4 };
  if (!body.source) { $('m_msg').innerHTML = '<span class="err">没有可用素材</span>'; return; }
  try {
    const r = await api('/api/tasks/style', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)});
    $('m_msg').textContent = '已提交 ' + r.id; selTask = r.id; selStep = null; selFrame = null; evs = []; evAfter = 0; refresh();
  } catch (e) { $('m_msg').innerHTML = '<span class="err">'+esc(e.message)+'</span>'; }
}

// ---- 帧网格 / 对比查看 / 用量
let selFrame = null, _gridSig = '', _viewSig = '';
function frameClass(f) {
  const st = f.status === 'DONE' && f.cached ? 'cached' : f.status;
  return `fc ${st}${f.maybe_duplicated ? ' dup' : ''}${selFrame && selFrame.item === f.item_key && selFrame.step === f.step_key ? ' sel' : ''}`;
}
async function renderFrames(t) {
  const has = t.steps.some(s => s.key.startsWith('stylize_'));
  $('framesrow').style.display = has ? '' : 'none';
  if (!has) return;
  let fr, us;
  try { [fr, us] = await Promise.all([api(`/api/tasks/${t.id}/frames`), api(`/api/tasks/${t.id}/usage`)]); } catch (e) { return; }
  const sig = fr.frames.map(f => f.step_key + f.item_key + f.status + f.calls + (selFrame ? selFrame.item : '')).join('|');
  if (sig !== _gridSig) {
    _gridSig = sig;
    const legend = [['DONE','完成'],['cached','命中帧缓存'],['INFLIGHT','请求中'],['RETRY','等待重试'],['FAILED','失败'],['DEGRADED','降级(原图直通)'],['PENDING','待处理']]
      .map(([k, n]) => `<span><i class="fc ${k}" style="display:inline-block;width:10px;height:10px;animation:none"></i>${n}</span>`).join('');
    $('framegrid').innerHTML = `<div class="legend">${legend}<span><i style="border:1px solid #fff"></i>白框=可能被重复计费</span></div>` +
      (fr.frames.length ? `<div style="display:flex;flex-wrap:wrap;gap:3px">` + fr.frames.map(f =>
        `<div class="${frameClass(f)}" title="帧 ${f.idx} · ${f.status} · 调用 ${f.calls}" onclick="pickFrame('${f.step_key}','${f.item_key}')"></div>`).join('') + '</div>'
        : '<span class="muted">工序 3 还没有开始(关键帧提取完成后才会出现)</span>') +
      `<div class="muted" style="margin-top:6px">${Object.entries(fr.by_status).map(([k, v]) => k + ' ' + v).join(' · ')}</div>`;
  }
  const u = us.total || {}, bud = us.budget_cny, pct = bud ? Math.min((u.cost_cny_est || 0) / bud * 100, 100) : 0;
  $('usage').innerHTML = us.total && Object.keys(u).length ? `
    <div>${esc(us.provider || '')} ${esc(us.model || '')} · 单价 ${esc(us.price_cny)} 元/张</div>
    <table style="width:auto;margin:4px 0"><tr><td class="muted">帧数</td><td>${u.frames}</td><td class="muted">接口调用</td><td>${u.calls}</td></tr>
      <tr><td class="muted">计费张数</td><td>${u.billed}</td><td class="muted">output_tokens</td><td>${u.output_tokens}</td></tr>
      <tr><td class="muted">帧缓存命中</td><td>${u.cached}</td><td class="muted">降级 / 失败</td><td>${u.degraded} / ${u.failed}</td></tr></table>
    <div>费用估算 <b>${(u.cost_cny_est || 0).toFixed(2)} 元</b>${bud ? ` / 预算 ${bud} 元` : ''}
      ${u.maybe_billed ? `<span class="err"> · 可能多付 ${u.maybe_billed} 张 ≈ ${(u.cost_maybe_extra_cny_est || 0).toFixed(2)} 元</span>` : ''}</div>
    <div class="bar ${pct > 90 ? 'bad' : ''}"><i style="width:${pct}%"></i></div>
    <div class="muted" style="margin-top:4px">${esc(us.note)}</div>
    <details style="margin-top:4px"><summary>按块</summary><table><tr><th>块</th><th>帧</th><th>调用</th><th>计费</th><th>tokens</th><th>费用</th></tr>
      ${Object.entries(us.per_step).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v.frames}</td><td>${v.calls}</td><td>${v.billed}</td><td>${v.output_tokens}</td><td>${v.cost_cny_est}</td></tr>`).join('')}</table></details>`
    : '<span class="muted">还没有用量记录</span>';
}
async function pickFrame(step, item) { selFrame = {step, item}; _gridSig = ''; _viewSig = ''; if (curTask) await renderFrames(curTask); renderFrameView(); }
async function renderFrameView() {
  if (!selFrame || !selTask) { $('frameview').innerHTML = ''; return; }
  let items = [];
  try { items = (await api(`/api/tasks/${selTask}/frames`)).frames; } catch (e) { return; }
  const f = items.find(x => x.step_key === selFrame.step && x.item_key === selFrame.item); if (!f) return;
  const sig = selTask + selFrame.item + f.status + f.calls + f.updated_at;
  if (sig === _viewSig) return; _viewSig = sig;
  const base = `/api/tasks/${selTask}/frames/${f.step_key}/${f.item_key}/image`;
  $('frameview').innerHTML = `<div><b>帧 ${f.idx}</b> <span class="badge st-${f.status === 'DONE' ? 'SUCCEEDED' : f.status === 'FAILED' ? 'FAILED' : 'RUNNING'}">${esc(f.status)}</span>
    <span class="muted">${esc(f.step_key)}</span></div>
    <div style="display:flex;gap:8px;margin:4px 0"><div><div class="muted">源帧</div><img src="${base}?kind=src&w=360" style="max-width:100%;border:1px solid var(--line)"></div>
      <div><div class="muted">结果</div><img src="${base}?kind=out&w=360" style="max-width:100%;border:1px solid var(--line)" onerror="this.alt='还没有结果'"></div></div>
    <table style="width:auto"><tr><td class="muted">调用次数</td><td>${f.calls}</td><td class="muted">计费</td><td>${f.billed}</td><td class="muted">可能多付</td><td>${f.maybe_billed}</td></tr>
      <tr><td class="muted">tokens</td><td>${f.output_tokens}</td><td class="muted">缓存/复用</td><td>${f.cached ? '帧缓存' : f.resumed ? '续跑复用' : '-'}</td><td class="muted">耗时</td><td>${f.latency_s ?? '-'}s</td></tr></table>
    ${f.error ? `<div class="err">${esc(f.error_kind || '')}: ${esc(f.error)}</div>` : ''}
    ${f.size_adjusted ? `<div class="muted">返回尺寸 ${f.size_adjusted.join('x')},已规整到标准尺寸</div>` : ''}`;
}

async function submitPlan() {
  const request = $('nl').value.trim(); if (!request) return;
  $('planmsg').textContent = '规划中…';
  const r = await fetch('/api/plan', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({request})});
  const j = await r.json();
  if (r.ok) {
    $('planmsg').innerHTML = `已提交 ${esc(j.task_id)} · 规划 ${j.rounds} 轮` + (j.rounds > 1
      ? `<div class="err">第 1 轮被护栏退回:${esc((j.attempts[0].errors||[]).join(';'))}</div>` : '');
    selTask = j.task_id; selStep = null; evs = []; evAfter = 0; refresh();
  } else {
    const d = j.detail || {}; const last = (j.attempts||[]).slice(-1)[0] || {};
    $('planmsg').innerHTML = `<span class="err">计划被拒绝(${j.rounds||'?'} 轮仍不合规):${esc((j.errors||last.errors||[j.detail]).join(';'))}</span>`;
  }
}
async function diagnose(key) {
  try { await api(`/api/tasks/${selTask}/steps/${key}/diagnose`, {method:'POST'}); } catch (e) { alert(e.message); }
  refresh();
}
async function decide(thread, approve) {
  const comment = approve ? '' : (prompt('拒绝原因?') || '');
  try { await api(`/api/diagnoses/${thread}/decision`, {method:'POST', headers:{'content-type':'application/json'},
        body:JSON.stringify({approve, comment, who:'dashboard'})}); } catch (e) { alert(e.message); }
  refresh();
}

async function act(path) {
  try { await api(path, {method:'POST', headers:{'content-type':'application/json'}, body:'{}'}); }
  catch (e) { alert(e.message); }
  refresh();
}
async function approve(key, decision) {
  const comment = decision==='reject' ? (prompt('拒绝原因?') || '') : '';
  try { await api(`/api/tasks/${selTask}/steps/${key}/approve`, {method:'POST', headers:{'content-type':'application/json'},
        body:JSON.stringify({decision, who:'dashboard', comment})}); } catch (e) { alert(e.message); }
  refresh();
}

function renderHeader(m, ws) {
  const t = m.tasks_by_status || {};
  $('chips').innerHTML = [
    ['任务', Object.entries(t).map(([k,v])=>k[0]+k.slice(1).toLowerCase()+' '+v).join(' / ') || '0'],
    ['队列深度', m.queue_depth], ['缓存命中步骤', m.cache_hit_steps],
    ['有效耗时', (m.effective_seconds||0)+'s'], ['浪费耗时', (m.wasted_seconds||0)+'s'],
    ['浪费率', m.waste_ratio==null?'-':(m.waste_ratio*100).toFixed(1)+'%'],
  ].map(([a,b])=>`<span class="chip">${a} <b>${esc(b)}</b></span>`).join(' ');
  $('workers').innerHTML = ws.map(w => `<span class="chip ${w.alive?'':'dead'}">${esc(w.id)} ${esc(w.resources.join('/'))} ${w.alive?'在线':'失联'}${w.current_step?' · 执行中':''}</span>`).join(' ');
}

function renderTasks(list) {
  $('tasks').innerHTML = list.map(t => {
    const bad = t.status==='FAILED', ok = t.status==='SUCCEEDED';
    return `<div class="task ${t.id===selTask?'sel':''}" onclick="pick('${t.id}')">
      <div class="row"><b>${esc(t.name)}</b><span class="badge st-${t.status}">${t.status}</span></div>
      <div class="muted">${esc(t.id)} · ${t.steps_succeeded}/${t.steps_total} 步 · 缓存 ${t.cached_steps}</div>
      <div class="bar ${ok?'ok':bad?'bad':''}"><i style="width:${t.percent}%"></i></div></div>`;
  }).join('') || '<span class="muted">暂无任务</span>';
}
function pick(id) { selTask = id; selStep = null; selFrame = null; _gridSig = ''; _viewSig = ''; evs = []; evAfter = 0; refresh(); }

function layout(steps) {
  const by = Object.fromEntries(steps.map(s => [s.key, s])), depth = {};
  const d = k => depth[k] ??= (by[k].deps.length ? 1 + Math.max(...by[k].deps.map(d)) : 0);
  steps.forEach(s => d(s.key));
  const cols = {};
  steps.forEach(s => (cols[depth[s.key]] ??= []).push(s));
  const pos = {};
  Object.entries(cols).forEach(([c, arr]) => arr.forEach((s, i) => pos[s.key] = {x: c*200+10, y: i*72+10}));
  const W = (Math.max(...Object.keys(cols).map(Number))+1)*200+20, H = Math.max(...Object.values(cols).map(a=>a.length))*72+20;
  return {pos, W, H};
}

function renderDag(t) {
  const {pos, W, H} = layout(t.steps);
  let svg = `<svg id="edges" width="${W}" height="${H}"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4b5767"/></marker></defs>`;
  t.steps.forEach(s => s.deps.forEach(dk => {
    const a = pos[dk], b = pos[s.key], x1 = a.x+158, y1 = a.y+29, x2 = b.x, y2 = b.y+29, mx = (x1+x2)/2;
    svg += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2-2},${y2}" stroke="#3a4656" fill="none" marker-end="url(#ar)"/>`;
  }));
  svg += '</svg>';
  const nodes = t.steps.map(s => {
    const p = pos[s.key], extra = s.status==='RUNNING' ? ` ${(s.progress*100|0)}%` : '';
    return `<div class="node n-${s.status} ${s.key===selStep?'sel':''}" style="left:${p.x}px;top:${p.y}px" onclick="pickStep('${s.key}')">
      <div class="k">${esc(s.key)}${s.resource==='gpu'?'<span class="tag gpu">GPU</span>':''}${s.cached?'<span class="tag cache">缓存</span>':''}${s.attempt_no>1?`<span class="tag retry">#${s.attempt_no}</span>`:''}</div>
      <div class="m">${s.status}${extra}${s.error_kind?' · '+esc(s.error_kind):''}</div>
      <div class="bar ${s.status==='SUCCEEDED'?'ok':''}"><i style="width:${s.status==='SUCCEEDED'?100:(s.progress*100)}%"></i></div></div>`;
  }).join('');
  return `<div id="dagwrap"><div id="dag" style="width:${W}px;height:${H}px">${svg}${nodes}</div></div>`;
}

function renderDetail(t) {
  const wait = t.waiting_approval.map(k => `<button onclick="approve('${k}','approve')">批准 ${esc(k)}</button>
        <button class="danger" onclick="approve('${k}','reject')">拒绝</button>`).join(' ');
  $('detail').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
      <div><b>${esc(t.name)}</b> <span class="muted">${esc(t.id)}</span> <span class="badge st-${t.status}">${t.status}</span>
        ${t.has_failed_steps && t.status==='RUNNING' ? '<span class="badge st-RETRY_WAIT">存在失败步骤</span>':''}
        <span class="muted"> ${t.percent}% · 运行中: ${esc(t.running_steps.join(', ')||'-')}</span></div>
      <div>${wait}
        <button onclick="act('/api/tasks/${t.id}/resume')" ${t.status==='FAILED'?'':'disabled'}>恢复(重试失败步骤)</button>
        <button class="danger" onclick="act('/api/tasks/${t.id}/cancel')" ${['SUCCEEDED','CANCELLED'].includes(t.status)?'disabled':''}>取消</button></div>
    </div>
    <div class="bar ${t.status==='SUCCEEDED'?'ok':t.status==='FAILED'?'bad':''}" style="height:7px;margin:8px 0"><i style="width:${t.percent}%"></i></div>
    ${renderDag(t)}`;
}

const artUrl = a => `/api/artifacts/${a.sha256}?name=${encodeURIComponent(a.name)}`;
const fmtSize = n => n == null ? '' : n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(2) + ' MB';
function artHtml(a) {
  const head = `<code>${esc(a.name)}</code> <span class="muted">${fmtSize(a.size)} · ${esc((a.sha256||'').slice(0,10))}</span>`;
  if (a.kind === 'image') return `<div>${head}<br><a href="${artUrl(a)}" target="_blank"><img src="${artUrl(a)}" style="max-width:100%;max-height:200px;border:1px solid var(--line);margin-top:3px"></a></div>`;
  if (a.kind === 'video') return `<div>${head}<br><video controls preload="metadata" src="${artUrl(a)}" style="max-width:100%;max-height:220px;margin-top:3px"></video></div>`;
  if (a.kind === 'text' && a.preview != null)
    return `<details><summary>${head}</summary><pre style="white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;background:#0f1419;padding:6px;margin:3px 0">${esc(a.preview)}</pre></details>`;
  return `<div>${head} <a href="${artUrl(a)}" target="_blank">下载</a></div>`;
}
function usageHtml(att) {
  const n = (att && att.notes) || {};
  const u = n.usage; if (!u && n.cost_cny_est == null) return '<span class="muted">本步骤没有记录用量</span>';
  const rows = Object.entries(u || {}).filter(([k, v]) => v !== null && v !== undefined)
    .map(([k, v]) => `<tr><td class="muted">${esc(k)}</td><td>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</td></tr>`).join('');
  const cost = n.cost_cny_est != null ? `<tr><td class="muted">cost_cny_est</td><td><b>${esc(n.cost_cny_est)} 元</b> <span class="muted">${esc(n.cost_note || '')}</span></td></tr>` : '';
  return `<table style="width:auto">${rows}${cost}</table>`;
}
let _stepSig = '';
async function renderStep(t) {
  if (!selStep) { $('stepinfo').innerHTML = '<span class="muted">未选择步骤</span>'; _stepSig = ''; return; }
  const s = t.steps.find(x => x.key === selStep); if (!s) return;
  // 没有变化就不重绘:否则每秒刷新会把正在播放的视频重置
  const sig = [t.id, s.key, s.status, s.attempt_no, s.failures, s.finished_at, s.status === 'RUNNING' ? s.progress_msg : ''].join('|');
  if (sig === _stepSig) return;
  let atts = [], io = {params: {}, inputs: [], outputs: []};
  try { atts = await api(`/api/tasks/${t.id}/steps/${selStep}/attempts`); } catch (e) {}
  try { io = await api(`/api/tasks/${t.id}/steps/${selStep}/io`); } catch (e) {}
  _stepSig = sig;
  const last = atts[atts.length - 1];
  const retryBtn = s.status==='FAILED' ? `<button onclick="act('/api/tasks/${t.id}/steps/${s.key}/retry')">重试此步骤</button>
    <button onclick="diagnose('${s.key}')">AI 诊断</button>` : '';
  const ck = s.checkpoint ? (s.checkpoint.external_task_id
    ? `<div>检查点: 外部任务 <code>${esc(s.checkpoint.external_task_id)}</code>(重试时沿用,不会重复提交)</div>`
    : `<div>检查点: <code>已完成 ${esc(s.checkpoint.done)} 帧</code></div>`) : '';
  const inputs = io.inputs.length ? io.inputs.map(g => `<div style="margin:4px 0"><span class="muted">来自 <b>${esc(g.from)}</b> (${esc(g.status)})</span>
      ${g.artifacts.map(artHtml).join('') || '<div class="muted">无产物</div>'}</div>`).join('') : '<span class="muted">无上游步骤</span>';
  const outputs = io.outputs.length ? io.outputs.map(artHtml).join('') : '<span class="muted">暂无产物</span>';
  const notes = (a) => {
    const n = a.notes || {}, polls = Object.keys(n).filter(k => /^poll_\d+$/.test(k)).sort();
    const rest = Object.fromEntries(Object.entries(n).filter(([k]) => !/^poll_\d+$/.test(k) && k !== 'usage'));
    const pollTbl = polls.length ? `<details><summary>外部任务轮询 ${polls.length} 轮</summary><table style="width:auto"><tr><th>轮</th><th>状态</th><th>已等待</th><th>token</th><th>usage</th></tr>
      ${polls.map(k => `<tr><td>${k.slice(5)}</td><td>${esc(n[k].status)}</td><td>${esc(n[k].elapsed_s)}s</td><td>${esc(n[k].tokens)}</td><td>${esc(n[k].usage ? JSON.stringify(n[k].usage) : '')}</td></tr>`).join('')}</table></details>` : '';
    const restTxt = Object.keys(rest).length ? `<details><summary>备注(notes)</summary><pre style="white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto;margin:3px 0">${esc(JSON.stringify(rest, null, 2))}</pre></details>` : '';
    return pollTbl + restTxt;
  };
  $('stepinfo').innerHTML = `
    <div><b>${esc(s.key)}</b> <span class="badge st-${s.status}">${s.status}</span> <span class="muted">${esc(s.type)}</span> ${retryBtn}</div>
    <div class="muted">依赖: ${esc(s.deps.join(', ')||'无')} · 资源: ${s.resource} · 失败预算 ${s.failures}/${s.max_attempts} · 租约丢失 ${s.lost_count}</div>
    ${s.status==='RUNNING'?`<div>租约持有者 <code>${esc(s.lease_owner)}</code> 到期 ${fmtT(s.lease_expires_at)} · 进度 ${esc(s.progress_msg||'')}</div>`:''}
    ${s.status==='RETRY_WAIT'?`<div>下次重试 ${fmtT(s.next_run_at)}</div>`:''}
    ${ck}
    ${s.error_msg?`<div class="err">${esc(s.error_kind)}: ${esc(s.error_msg).slice(0,400)}</div>`:''}
    <div class="muted">cache_key ${esc((s.cache_key||'').slice(0,12))}${s.cached?' (命中缓存,未执行)':''}</div>
    <h3 style="margin:8px 0 2px;font-size:13px">用量 / 费用 <span class="muted">(最近一次尝试)</span></h3>${usageHtml(last)}
    <h3 style="margin:8px 0 2px;font-size:13px">输入</h3>${inputs}
    <h3 style="margin:8px 0 2px;font-size:13px">输出</h3>${outputs}
    <details style="margin-top:6px"><summary>参数(params)</summary><pre style="white-space:pre-wrap;word-break:break-all;max-height:200px;overflow:auto">${esc(JSON.stringify(io.params, null, 2))}</pre></details>
    <h3 style="margin:8px 0 2px;font-size:13px">执行记录</h3>
    <table style="margin-top:2px"><tr><th>#</th><th>worker</th><th>开始</th><th>耗时</th><th>结果</th><th>备注</th></tr>
    ${atts.map(a => `<tr><td>${a.attempt_no}</td><td>${esc(a.worker_id)}</td><td>${fmtT(a.started_at)}</td><td>${fmtD(a.duration)}</td>
      <td>${esc(a.outcome)}${a.error_kind?' / '+esc(a.error_kind):''}<div class="err">${esc((a.error_msg||'').slice(0,160))}</div></td>
      <td>${notes(a)}</td></tr>`).join('') || '<tr><td colspan=6 class="muted">无执行记录</td></tr>'}</table>`;
}

function pickStep(k) { selStep = k; _stepSig = ''; if (curTask) { $('detail').querySelectorAll('.node').forEach(n => n.classList.toggle('sel', n.querySelector('.k').textContent.startsWith(k))); renderStep(curTask); } }

function renderEvents() {
  $('events').innerHTML = evs.slice(-120).reverse().map(e => {
    const d = e.detail ? ' ' + JSON.stringify(e.detail) : '';
    return `<div class="k-${e.kind}">#${e.seq} ${fmtT(e.ts)} ${esc(e.kind)} ${esc(e.step_key||'')} ${esc(e.from||'')}${e.to?'→'+esc(e.to):''}${e.attempt_no?' a'+e.attempt_no:''}${esc(d.slice(0,200))}</div>`;
  }).join('');
}

async function renderAgent(t) {
  let ds = [], calls = [], usage = {};
  try { [ds, calls, usage] = await Promise.all([api('/api/diagnoses?task_id=' + t.id),
        api('/api/llm_calls?task_id=' + t.id), api('/api/llm_usage?task_id=' + t.id)]); } catch (e) {}
  $('diag').innerHTML = ds.map(d => {
    const p = d.proposal || {};
    const btns = d.status === 'AWAITING_HUMAN'
      ? `<div style="margin-top:4px"><button onclick="decide('${d.thread_id}',true)">确认执行 ${esc('retry_step')}</button>
         <button class="danger" onclick="decide('${d.thread_id}',false)">拒绝</button></div>`
      : `<div class="muted">${d.result ? (d.result.executed ? '已执行' : '未执行:' + esc(d.result.reason)) : ''}</div>`;
    return `<div style="border-bottom:1px solid var(--line);padding:4px 0"><b>${esc(d.step_key)}</b>
      <span class="badge ${d.status==='DONE'?'st-SUCCEEDED':'st-AWAITING_APPROVAL'}">${d.status}</span>
      <div>根因:${esc(p.root_cause)} <span class="muted">(${esc(p.category)}, 置信度 ${p.confidence})</span></div>
      <div>建议:<code>${esc(p.recommended_action)}</code> — ${esc(p.explanation)}</div>${btns}</div>`;
  }).join('') || '<span class="muted">暂无诊断。在失败步骤详情里点“AI 诊断”。</span>';
  const est = usage.estimated_calls ? ' · 含估算 token(Mock/供应商未返回)' : '';
  $('llm').innerHTML = `<div class="muted">${usage.calls||0} 次调用 · prompt ${usage.prompt_tokens||0} / completion ${usage.completion_tokens||0} tokens · $${usage.cost_usd||0}${est}</div>
    <table><tr><th>时间</th><th>用途</th><th>模型</th><th>tokens</th><th>耗时</th><th>状态</th></tr>
    ${calls.map(c => `<tr><td>${fmtT(c.ts)}</td><td>${esc(c.purpose)}</td><td>${esc(c.provider)}/${esc(c.model)}</td>
      <td>${c.prompt_tokens??'-'}/${c.completion_tokens??'-'}${c.tokens_estimated?'~':''}</td><td>${fmtD(c.latency_s)}</td>
      <td>${esc(c.status)}${c.error?' '+esc(c.error.slice(0,60)):''}</td></tr>`).join('') || '<tr><td colspan=6 class="muted">无调用</td></tr>'}</table>`;
}

async function refresh() {
  try {
    const [list, m, ws] = await Promise.all([api('/api/tasks'), api('/api/metrics'), api('/api/workers')]);
    renderHeader(m, ws);
    if (!selTask && list.length) selTask = list[0].id;
    renderTasks(list);
    if (selTask) {
      const t = await api('/api/tasks/' + selTask); curTask = t;
      renderDetail(t); await renderStep(t); await renderFrames(t); renderFrameView(); await renderAgent(t);
      const more = await api(`/api/tasks/${selTask}/events?after=${evAfter}`);
      if (more.length) { evs = evs.concat(more); evAfter = more[more.length-1].seq; }
      renderEvents();
    }
  } catch (e) { console.warn(e); }
}
loadMedia(); refresh(); setInterval(refresh, 1000);
</script>
</body>
</html>
